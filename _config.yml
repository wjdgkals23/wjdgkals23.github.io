  - title: Work Experience (2019 ~ )
    layout: list
    content:
      - layout: top-middle
        title: 보살핌 — 케어파트너 · 케어아카데미
      - layout: left
        sub_title: Product Engineer (Full Stack)
        caption: 2023.02 ~
        description: |
          요양보호사 구인·구직 플랫폼 [케어파트너](https://carepartner.kr)와 요양보호사 교육 서비스 케어아카데미를 만듭니다.
          Next.js 모노레포(프론트) · NestJS/Prisma(API) · Rails(배치/알림) · Kotlin(앱) · AWS/GCP/Vercel 전반을 담당하며, 2025년 하반기부터 테크 챕터 운영을 맡고 있습니다.

          **2026 — 테크 챕터 운영 · 품질 자동화 · AI Native**
          - 전사 비용 대시보드(AWS/GCP/Vercel 비용 수집 + 가입자 수 맥락) 구축, 서버 ScaleUp 정책·DB/Redis 스펙·분석 DB 비용 설계 등 인프라 비용 오너십
          - Playwright E2E 하네스 + GitHub Actions(Vercel 배포 트리거 연동) 구축, SQL 인젝션 감사(테스트 28건), 핵심 로직 단위 테스트 도입
          - 배치/알림 백엔드를 Lambda(Jets) → Rails 7.1 + ECS Fargate(api/worker/cron)로 2주 내 이관, EventBridge 스케줄 55개 멱등 등록, RuboCop/CI/PR 자동 리뷰 정착
          - 공공기관 일자리 알림 제품(크롤링 → 지오코딩 → PostGIS 5km 반경 API → 알림톡), 맞춤 일자리 추천 온보딩, 설문 플랫폼(동시성 안전한 카드 배정), 외부 파트너 API(API key + 레이트리밋)
          - 리텐션 푸시 개인화 실험(실험 플랫폼 벌크 조회 + 개인화 빌더 + 앱 진입 모달), 내 강의실 가로모드/영상 컨트롤러 실험
          - 팀 AI 개발 환경: 스킬 레포 구조 설계·정착, SQL 생성/Redash 스킬, Linear → 자동 PR, CLAUDE.md 체계, GitHub·배포 교육, 신규 엔지니어 온보딩 문서
          - Android targetSdk 36 대응, 화면 방향 제어 리팩터(단위·계측 테스트 포함), 2.10 ~ 2.13 릴리즈

          **2025 — 앱 전환 · 케어아카데미 론칭 · 메시징 인프라**
          - Flutter → Kotlin 앱 전환 초기 멤버(카카오 로그인, FCM, 네이티브 화면, 실험 플랫폼 클라이언트, 광고 SDK), 점진 배포 20→50→100%(크래시율 0%), 릴리즈 공지 채널·템플릿 정착
          - 케어아카데미 론칭: 강의 영상(Vimeo) 플레이어, 수강신청·Toss 결제 검증, 시험·자격증, NPS, 이력서 진단 플로우, 수강 알림톡 2·3일차 리텐션 실험
          - 카카오 브랜드메시지 발송 인프라(S3 업로드 → 배치 분할 → SQS → 스케줄러, 발송 결과 모니터링, 전환률 분석), 알림톡 cron 중복 실행 락
          - 이벤트 로깅 통합 리팩터(364파일), Sentry 에러 핸들링 체계, Vercel 비용 절감(이미지 전송량 102GB → 39GB), 미사용 페이지 정리
          - 행정안전부 주소 API 장애 긴급 대체 → 네이버/카카오 fallback 구조화, Firebase Dynamic Link 종료 대응
          - 시니어 엔지니어 퇴사 후 AWS/GCP/Play Console 계정 인수, 테크 챕터 2026 과제 정의 및 분기 플래닝 반영, 개발자 채용 면접관
          - 포인트 시스템 교체 마이그레이션, 혜택탭 앱 전환, 홈탭 UX 실험

          **2023 ~ 2024 — 성장 퍼널 · B2G 사업 · 백엔드 이관**
          - 요양보호사·기관 유입 퍼널(이벤트, SEO, 워크넷 간편지원, 크롤링 서버 연동)과 재진입 퍼널(알림톡, 앱푸시) 구축으로 활성 유저·리텐션 성장에 기여
          - B2G 노인일자리 취업지원사업 개발 리드: 취업확인서·근로계약서·주민번호 수취 플로우, 연도별 동의 갱신, Redash 대상자 추출. 휴면 유저 친구톡 활성화(2,506명 발송 → 251명 활성화)
          - 레거시 Rails API → NestJS/Prisma 이관(기관 정보, 공고 종료, 증빙 업로드), command/query 분리·트랜잭션 전달 패턴 도입
          - 기관 제품: 공고 리스트/상세/통계 리뉴얼, 번개채용, 카카오 공유, 기관 NPS, 포인트 API
          - 신규 비즈니스(비급여 돌봄) 초기 서비스 론칭 및 운영
