          | A/B 실험 운영 · 데이터 계측 | **4** (플랫폼 설계는 3) | 실험 추가 → 측정 → 정리 사이클 수십 회, 노출 로깅 게이팅, Mixpanel 이벤트·UTM 설계, 실험 플랫폼 bulk lookup/할당 API 확장 |
