about_title: Hello!
about_profile_image:
about_content: |
  안녕하세요. Product Engineer 정하민입니다.

  엔지니어링은 저에게 다양한 사람들과 함께 문제해결의 기회를 준 고마운 도구입니다.
  현재는 모바일 엔지니어링에 치중되어 있지만, 5년 안에는 어떠한 문제도 풀 수 있는 엔지니어가 되는 것을 목표로 하고 있습니다. (2022.11)

  팀원들과 필요한 것을 학습하고 적용하며 꽤 많은 문제에 기여할 수 있는 엔지니어로 성장했다고 생각합니다.
  앞으로의 목적은 "현재의 비즈니스와 조직 구성 상황에 맞게끔 유연하게 변할 수 있는, 문제해결에 걸림돌이 되지 않는 소프트웨어를 만드는 것"입니다. (2024.12)

  보살핌에서 요양보호사 구인·구직 플랫폼(케어파트너)과 교육 서비스(케어아카데미)를 만들며, 기획 → 프론트 → 백엔드 → DB → 배치/메시징 → 실험 계측 → 정리까지 제품 하나를 혼자 끝까지 닫는 일을 해왔습니다.
  2025년 하반기부터는 시니어 엔지니어 부재 상황에서 테크 챕터 운영(분기 기술 과제, 인프라·비용·계정 오너십, 신규 엔지니어 온보딩)과 팀의 AI 개발 환경 구축을 맡고 있습니다.

  아래의 업무 방식·강점·보완점·숙련도는 최근 2년(2024.10 ~ 2026.10)의 Slack 대화, GitHub 기록(커밋·PR·리뷰), 사내 360도 피드백 2회를 교차 분석해 근거가 있는 내용만 적었습니다. (2026.10)

content:
  - title: About Me
    layout: list
    content:
      - layout: left
        title: 업무 방식
        description: |
          - **문제를 먼저 공개합니다.** 장애·실수·사이드이펙트는 발견 즉시 현상/원인/영향/해결/백로그 형식으로 전사에 공유하고, 재발 방지 장치(fallback 구조, whitelist 강제, cron 중복 실행 락)를 같이 만듭니다.
          - **결정은 글로, 수치와 함께 공유합니다.** 서버 스케일링 정책, 비용 절감, 발송 인프라 설계처럼 팀에 영향을 주는 변경은 as-is/to-be와 측정값을 적어 공지한 뒤 실행합니다.
          - **실험은 가설·지표·롤백 조건을 먼저 정하고, Lesson Learned로 닫습니다.** 2년간 수십 건의 실험을 추가 → 측정 → 정리(cut)까지 직접 수행했습니다.
          - **선제 조사 후 선택지와 장단점을 가져갑니다.** 동료 피드백: "clue 없이 막막하게 고민하는 대신 좋은 선택지 중 최선을 고를 수 있게 해준다."
          - **만든 것을 남이 쓸 수 있는 형태(가이드·템플릿·스킬·강의)로 바꿉니다.** 매니저 피드백: "본인이 잘하는 걸 옆에서 알려주고 끝내지 않고, 강의든 레포든 스킬이든 남는 형태로 만든다."
          - **아무도 급하다고 하지 않는 일(비용 누수, 문서 산재, 노후 라이브러리)을 스스로 문제로 규정하고 순서를 정해 처리합니다.**
          - 피드백 주기가 짧은 것을 선호하며, 피드백을 받으면 빠르게 수용합니다. 잘못 이해한 채로 업무하는 것을 극도로 싫어해 목표 관리 도구(Linear)를 적극 활용합니다.
      - layout: left
        title: 강점 (근거 기반)
        description: |
          - **End-to-end 실행력** — 맞춤 일자리 추천, 비용 대시보드, 설문 플랫폼, 공공기관 일자리 알림(크롤링 → 지오코딩 → 알림톡)처럼 프론트·백엔드·배치 3개 레포를 동시에 바꾸는 작업을 혼자 설계·구현·계측했습니다. 최근 2년간 프론트(Next.js 모노레포)와 백엔드(NestJS) 메인 레포 커밋의 약 30%, 배치/알림 레포 커밋의 약 38%를 작성했습니다.
          - **메시징·발송 인프라 도메인 깊이** — 알림톡/친구톡/브랜드메시지/앱푸시 발송 인프라를 2년 내내 설계·운영했습니다. S3 → 배치 분할 → SQS 발송 구조, 발송 결과 모니터링 배치, 실험군별 템플릿·UTM 로깅, 개인화 푸시 빌더, Lambda(Jets) → Rails/ECS Fargate 이관(2주, cron 핸들러 55개)을 수행했습니다.
          - **난이도 높은 프론트 구현** — 이벤트 로깅 통합(364파일 횡단 리팩터), 웹뷰 강제 가로모드 + 자체 영상 컨트롤러(레이아웃 이펙트 순서·canvas DPR 실측), 푸시 딥링크 진입 모달과 브라우저 히스토리 훅 결함 수정 등을 담당했습니다.
          - **비용·운영 감각** — 서버 ScaleUp 정책을 CPU 기준으로 재설계, Vercel 이미지 전송량 102GB → 39GB 절감, AWS/GCP/Vercel 비용을 모으는 전사 비용 대시보드를 구축해 "회사 리스크 하나를 줄였다"는 평가를 받았습니다.
          - **팀의 AI 개발 환경 구축** — Claude Code 스킬 레포 구조를 설계해 팀에 정착(이후 5명이 13개 스킬 추가), 비개발자용 SQL 생성 스킬·Redash 실행 CLI, Linear 티켓 → 자동 PR 러너, PR 자동 리뷰 워크플로, 프로젝트별 CLAUDE.md/AGENTS.md 체계와 GitHub 교육을 운영했습니다.
          - **장애 대응 속도** — 주말 행정안전부 주소 API 장애를 수 시간 내 카카오/네이버 API로 대체 배포 후 fallback 구조로 정착, DB 커넥션 풀 고갈을 쿼리 fan-out 축소로 해결하는 등 원인·검증을 기록하며 대응합니다.
      - layout: left
        title: 보완 중인 점 (솔직하게)
        description: |
          - **검증 없이 빠르게 쌓은 부채** — 2025년까지는 테스트 없이 셀프 머지하고 롤백으로 대응하는 패턴이 잦았고, 그 부채가 2026년에 운영 사고로 돌아온 경험이 있습니다. 2026년부터 Playwright E2E 하네스, 핵심 로직 단위 테스트, 린트/CI 게이트를 도입해 바꾸는 중이며 "변경 전 영향 범위 점검"을 습관화하고 있습니다.
          - **의사소통 정확도** — 구어체·은유 표현 때문에 맥락이 없는 사람이 정보를 판단하기 어렵다는 피드백을 받았습니다. 설계·장애 공유 글은 결정/이유/영향/요청 4항목으로 쓰는 연습을 하고 있습니다.
          - **만들어 놓고 지속 고도화하기** — 새 영역을 여는 것을 더 보람있어 하는 성향 탓에, 가이드·스킬·교육을 한 번 만든 뒤 업데이트가 끊기는 경우가 있었습니다. 분기 단위 갱신 오너십을 명시하는 방식으로 보완 중입니다.
          - **범위 과확장과 낙관적 추정** — 영업·CS·마케팅 교육까지 흡수해 병목이 된 적이 있고, 몰입 상태에서는 일정을 짧게 잡는 경향이 있습니다. 25분 업무/5분 휴식 규칙과 "각자 과제 1개를 제대로"라는 원칙으로 관리합니다.
          - **주장 강도** — 반론이 오면 빠르게 수용하는 편이라, 아키텍처 결정을 끝까지 주도해 종결하는 장면이 적다는 피드백이 있습니다. 결정이 필요한 논의는 오너와 마감일을 정하고 끝내는 것을 의식하고 있습니다.
      - layout: left
        title: 좋아하는 팀 문화
        description: |
          - 여러 목표를 산발적으로 진행하기보다 하나의 목표에 집중해 함께 해결하는 팀이 결국 승리한다고 생각합니다.
          - 큰 목표의 90%를 달성했을 때 충분히 칭찬하고, 나머지 10%를 어떻게 채울지 함께 고민하는 팀을 선호합니다.
          - 혼자 오래 고민하기보다 빠르게 논의하고 액션하는 것, 실수와 실패를 존중하며 함께 학습하는 것을 선호합니다.
          - 재택보다 오피스에서 협업하며 일하는 것을 선호합니다.

  - title: Tech Stack & Proficiency
    layout: list
    content:
      - layout: left
        title: 평가 기준
        description: |
          최근 2년간의 GitHub 기록(커밋·PR·diff)을 기준으로 **스스로 보수적으로** 매긴 등급입니다.
          **1** 입문 · **2** 기본 · **3** 실무 독립 수행 · **4** 설계·리딩 가능 · **5** 전문가

          2025년 11월 이후 산출물 품질(커밋 메시지, 테스트, 문서) 향상은 AI 코딩 도구 도입 시점과 일치합니다. 아래 등급은 그 도구를 포함한 현재의 생산성 기준입니다.
