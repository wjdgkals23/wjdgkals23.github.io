          |---|---|---|
          | Ruby on Rails / Jets 배치·알림 백엔드 | **4** (배치·알림 도메인) | Lambda(Jets) → Rails 7.1 + ECS Fargate 이관 단독 수행, ActiveJob/SQS 어댑터 교체, SQS poller 에러 핸들러, cron 55개 체계, RuboCop/CI 도입 |
          | NestJS / Node | **3+** | 메인 API 서버 PR 400건+, 모듈·가드·쓰로틀러·이벤트·크론, 외부 연동 10여 종(Toss 결제, 카카오 비즈메시지, 지오코딩, 채널톡, 비용 API) |
          | PostgreSQL / Prisma / SQL | **3+** | groupBy 집계로 커넥션 풀 고갈 해결, `FOR UPDATE SKIP LOCKED`, PostGIS 반경 쿼리 + CTE 커서 페이지네이션, SQL 인젝션 감사(테스트 28건) |
