          | 앱 WebView 하이브리드 브릿지 | **3+** | 앱 ↔ 웹 브릿지 패키지, 화면 방향 제어, 푸시 딥링크 진입, 세션 레코딩 중복 방지 |
          | 테스트 (Playwright E2E, Jest) | **3** | E2E 하네스(인증 상태, Vercel 배포 트리거 연동, 핵심 플로우 6종) + CI 구축. 단위 테스트 습관은 2026년부터 |
      - layout: left
        title: Backend
        description: |
